node:
  role: "prefill"
  ip_address: "192.168.1.10"
  tcp_port: 18515
  rdma_port: 19515
  vllm_port: 8100
  gpu_id: 0

orchestrator:
  address: "192.168.1.1"
  port: 9000

rdma:
  memory_pool_gb: 32
  max_concurrent_transfers: 16
  use_gpu_direct: true

# Transfer backend selection
# use_gpu: true  → GPUDirect RDMA (RDMAConnector, requires nvidia-peermem + A100-class GPU)
# use_gpu: false → Standard RDMA via MooncakeConnector (no GPU required, works on CPU-only servers)
use_gpu: true

logging:
  level: "info"
  file: "/var/log/rdma-kv/prefill-01.log"
